<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>$SPEEDRUN</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-sprites" aria-hidden="true"></div>
    <div id="sunLayer" class="sun-layer" aria-hidden="true"></div>
    <main class="wrap">
      <!-- Top banner -->
      <div class="banner-card">
        <img class="banner" src="banner.png" alt="Banner" />
      </div>

      <!-- Title -->
      <h1 class="title">$SPEEDRUN</h1>
      <p class="subtitle">Pumpfun speedrun to $100M</p>

      <!-- Market cap card -->
      <section class="card">
        <div class="card-head">
          <div class="label">MARKET CAP</div>
          <div class="live"><span class="dot"></span>LIVE</div>
        </div>

        <div class="market">
          <div class="value">
            <span id="mcap">$12.5K</span>
            <span class="muted">/ $100M</span>
          </div>

          <div class="bar">
            <div id="barFill" class="bar-fill" style="width: 0.0125%"></div>
          </div>

          <div class="bar-foot">
            <span class="muted">$0</span>
            <span id="pct" class="pct">0.0125%</span>
            <span class="muted">$100M</span>
          </div>
        </div>
      </section>

      <!-- Contract card -->
      <section class="card">
        <div class="label">CONTRACT ADDRESS</div>
        <div class="contract-row">
          <code id="ca" class="contract">PASTE_YOUR_CONTRACT_ADDRESS_HERE</code>
          <button id="copyBtn" class="btn small">COPY</button>
        </div>
      </section>

      <!-- Buy button -->
      <a class="btn big" href="PASTE_BUY_LINK_HERE" target="_blank" rel="noreferrer">
        BUY ON PUMP.FUN
      </a>

      <div class="tiny">
        Not financial advice. Info page only.
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
